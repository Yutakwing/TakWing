name: Regenerate static blog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - generate-site.mjs
      - article-content.mjs
      - notes-content.mjs
      - notes.css
      - notes.js
      - wordpress-posts.json
      - wordpress-site.json
      - academic.css
      - .github/workflows/regenerate-site.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate static pages
        run: node generate-site.mjs

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html notes.html posts search-index.json zh-hant zh-hans .nojekyll
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Regenerate static blog pages"
            git push
          fi
