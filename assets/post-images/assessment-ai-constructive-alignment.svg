<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Constructive alignment and AI assessment design</title>
  <desc id="desc">Editorial illustration showing learning outcomes, assessment evidence and AI use being aligned by an educator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="0.55" stop-color="#f6f1ff"/>
      <stop offset="1" stop-color="#fff6e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1f2a44" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="980" cy="150" r="130" fill="#dbeafe" opacity="0.75"/>
  <circle cx="180" cy="640" r="170" fill="#fde68a" opacity="0.35"/>
  <g filter="url(#shadow)">
    <rect x="145" y="135" width="910" height="530" rx="42" fill="#ffffff"/>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M350 285 C455 205 585 205 690 285"/>
    <path d="M732 330 C775 450 720 560 602 590"/>
    <path d="M545 588 C420 558 350 455 388 335"/>
  </g>
  <g>
    <rect x="228" y="240" width="250" height="145" rx="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="5"/>
    <text x="353" y="296" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#075985">Learning</text>
    <text x="353" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#075985">outcomes</text>
  </g>
  <g>
    <rect x="722" y="240" width="250" height="145" rx="28" fill="#fef3c7" stroke="#d97706" stroke-width="5"/>
    <text x="847" y="296" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#92400e">Assessment</text>
    <text x="847" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#92400e">evidence</text>
  </g>
  <g>
    <rect x="475" y="500" width="250" height="145" rx="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="5"/>
    <text x="600" y="557" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#5b21b6">AI use</text>
    <text x="600" y="595" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="600" fill="#6d28d9">visible or hidden?</text>
  </g>
  <g>
    <circle cx="600" cy="363" r="86" fill="#0f172a"/>
    <text x="600" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff">constructive</text>
    <text x="600" y="388" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff">alignment</text>
  </g>
  <g fill="#475569" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">
    <text x="600" y="715" text-anchor="middle">What are we actually assessing?</text>
  </g>
</svg>
